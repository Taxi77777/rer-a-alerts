name: Suivi Trafic RER A - Alertes Telegram

on:
  schedule:
    # S'exécute toutes les 5 minutes, 24h/24, 7j/7
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Permet de lancer le script manuellement depuis l'interface GitHub

permissions:
  contents: write  # Requis pour permettre à GitHub Actions de sauvegarder alerts_history.json

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Récupération du dépôt de code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Configuration de Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Installation des dépendances Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Exécution du script de détection des perturbations
      env:
        PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Sauvegarde de l'historique des alertes si modifié
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add alerts_history.json
        # Vérifier si alerts_history.json a été modifié
        if git diff-index --quiet HEAD --; then
          echo "Aucune nouvelle alerte ou mise à jour à committer."
        else
          git commit -m "chore: mise à jour automatique de l'historique des alertes [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        fi
