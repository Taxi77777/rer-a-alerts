name: Suivi Trafic RER A - Alertes Telegram

# ---------------------------------------------------------------------------
# SURVEILLANCE CONTINUE
#
# GitHub Actions traite les cron "best effort". Le workflow ne doit donc pas
# demander un nouveau run toutes les 5 minutes alors que chaque run reste
# actif plusieurs heures.
#
# Solution : un run lance une boucle qui interroge PRIM toutes les 60 secondes.
# Le cron ne sert qu'a relancer la boucle environ toutes les 6 heures.
#
# Le depot est PUBLIC afin de conserver les avantages de GitHub Actions pour
# cette execution longue.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'alerts_history.json'
  schedule:
    # Une nouvelle boucle environ toutes les 6 heures.
    # La boucle elle-meme effectue les scans toutes les 60 secondes.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Requis pour sauvegarder alerts_history.json

# Un seul run a la fois. Les executions planifiees ne peuvent pas lancer
# plusieurs boucles concurrentes.
concurrency:
  group: rer-a-alerts
  cancel-in-progress: false

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Recuperation du depot de code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configuration Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Boucle de surveillance (scan toutes les 60 secondes)
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          # Duree totale : 5h30 (19800 s), laissant une marge avant le prochain cron.
          DUREE=19800
          INTERVALLE=60
          DEBUT=$SECONDS
          CYCLE=0

          while [ $((SECONDS - DEBUT)) -lt $DUREE ]; do
            CYCLE=$((CYCLE + 1))
            echo "──────── Scan #$CYCLE — $(TZ=Europe/Paris date '+%d/%m %H:%M:%S') ────────"

            python main.py

            # Sauvegarde de l'historique uniquement s'il a change
            if ! git diff --quiet -- alerts_history.json; then
              git add alerts_history.json
              git commit -m "chore: mise a jour automatique de l'historique des alertes [skip ci]"
              git pull --rebase --autostash origin "${{ github.ref_name }}" || true
              git push origin "HEAD:${{ github.ref_name }}" || echo "⚠️ Push impossible, nouvelle tentative au prochain cycle."
            fi

            sleep $INTERVALLE
          done

          echo "✅ Fin de la boucle apres $CYCLE scans. Le prochain run planifie prend le relais."